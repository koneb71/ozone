name: __OZONE_APP_SLUG__-prod

# Ozone's Deploy runs this: the production image, with a database of its own. Ozone supplies the
# database password and the app's environment; development never uses this file.
services:
  app:
    build:
      context: .
      target: prod
    init: true
    restart: unless-stopped
    ports:
      - "${OZONE_PROD_BIND:-127.0.0.1}:${OZONE_PROD_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 2s

  # Applies the migrations before the app starts. It is the build stage, which has drizzle-kit.
  migrate:
    build:
      context: .
      target: build
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 1m
      start_interval: 1s

volumes:
  pgdata:
    labels:
      ozone.data: "true"
