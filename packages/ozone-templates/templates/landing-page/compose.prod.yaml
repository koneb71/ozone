name: __OZONE_APP_SLUG__-prod

# Ozone's Deploy runs this: the production image. Development never uses this file.
services:
  app:
    build:
      context: .
      target: prod
    init: true
    restart: unless-stopped
    ports:
      - "${OZONE_PROD_BIND:-127.0.0.1}:${OZONE_PROD_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 2s
