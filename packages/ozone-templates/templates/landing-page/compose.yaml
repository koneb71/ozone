name: __OZONE_APP_SLUG__

services:
  app:
    build:
      context: .
      target: dev
    init: true
    user: "${OZONE_UID:-1000}:${OZONE_GID:-1000}"
    ports:
      - "127.0.0.1:${OZONE_APP_PORT:-3000}:3000"
    environment:
      OZONE_WATCH_POLL: ${OZONE_WATCH_POLL:-0}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      # The first start installs dependencies before the server can answer.
      start_period: 10m
      start_interval: 2s

volumes:
  node_modules: {}
