name: __OZONE_APP_SLUG__

services:
  app:
    build:
      context: .
      target: dev
    init: true
    user: "${OZONE_UID:-1000}:${OZONE_GID:-1000}"
    ports:
      - "127.0.0.1:${OZONE_APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-0123456789abcdef0123456789abcdef}
      BETTER_AUTH_URL: http://localhost:${OZONE_APP_PORT:-3000}
      OZONE_WATCH_POLL: ${OZONE_WATCH_POLL:-0}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      # The first start installs dependencies before the server can answer.
      start_period: 10m
      start_interval: 2s

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      # Postgres 18+ images keep their data under /var/lib/postgresql/<major>.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 1m
      start_interval: 1s

volumes:
  node_modules: {}
  pgdata:
    labels:
      ozone.data: "true"
