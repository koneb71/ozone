name: Ozone release

# Builds what people install, for Linux, Apple silicon and Windows: the desktop app and the
# command-line archive the app fetches for a remote machine. A manual run keeps them as workflow artifacts. A v* tag also gathers them into a
# draft GitHub Release, which a person reads and publishes. The Mac app is signed and notarized when
# the signing secrets are set. Nothing else is signed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the build, without the v
        required: true
        default: 0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ozone-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Git's bash, on Windows too, so every step reads the same.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            key: linux-x64
          - name: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            key: darwin-arm64
          # Built on Windows itself: unsigned, so it needs none of the cross-signing upstream does.
          - name: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            key: win32-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Not a version: '$version'. Tag releases as v1.2.3, with all three numbers." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      # A cached Vite+ goes on PATH as /c/Users/..., which only bash reads; Node's spawn needs C:\.
      - name: Put Vite+ on the Windows PATH
        if: matrix.platform == 'win'
        run: cygpath -w "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"

      # The secret helper links libsecret; the rest is what Electron needs to open for the launch
      # check. patchelf points the command-line archive at the libatomic it carries.
      - name: Install Linux build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config libgtk-3-0t64 libnss3 libasound2t64 libgbm1 patchelf xvfb imagemagick

      - name: Stamp the version
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      - name: Build the server, web client and desktop shell
        run: vp run build:desktop:bundle

      - name: Build the resource monitor
        shell: bash
        run: |
          rustup target add "${{ matrix.rust_target }}"
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"
          mkdir -p "$RUNNER_TEMP/resource-monitor/${{ matrix.key }}"
          binary="t3-resource-monitor${{ matrix.platform == 'win' && '.exe' || '' }}"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/$binary" "$RUNNER_TEMP/resource-monitor/${{ matrix.key }}/"

      - name: Build the command-line archive
        shell: bash
        run: |
          node apps/server/scripts/cli.ts build-exe --verbose
          node scripts/build-cli-archive.ts \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ steps.version.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/resource-monitor" \
            --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ steps.version.outputs.version }}"

      # Signing is on when the certificate secret is set, so a fork without secrets still builds.
      # The build reads the notarization key and the provisioning profile as files.
      - name: Prepare macOS signing
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          OZONE_APPLE_TEAM_ID: ${{ secrets.OZONE_APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.OZONE_MACOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          if [[ -z "$CSC_LINK" ]]; then
            echo "No CSC_LINK secret: building unsigned."
            exit 0
          fi
          for name in CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER OZONE_APPLE_TEAM_ID PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "CSC_LINK is set but ${name%_P8} is not. Set every signing secret, or none." >&2
              exit 1
            fi
          done
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$dir/AuthKey.p8"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$dir/Ozone.provisionprofile"
          {
            echo "OZONE_DESKTOP_SIGNED=true"
            echo "APPLE_API_KEY=$dir/AuthKey.p8"
            echo "OZONE_MACOS_PROVISIONING_PROFILE=$dir/Ozone.provisionprofile"
          } >> "$GITHUB_ENV"

      - name: Build the desktop app
        env:
          OZONE_DESKTOP_REUSE_RESOURCE_MONITOR: true
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          OZONE_APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.OZONE_APPLE_TEAM_ID || '' }}
        run: |
          node scripts/build-desktop-artifact.ts \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ steps.version.outputs.version }}" \
            --skip-build \
            --verbose

      # A build can package fine and still not open. This starts the app people will download.
      - name: Open the app
        shell: bash
        run: |
          set -euo pipefail
          check=(node scripts/smoke-desktop-app.ts --artifacts-dir "$RUNNER_TEMP/launch-check")
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            mount="$RUNNER_TEMP/launch-dmg"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$(ls release/*.dmg)"
            trap 'hdiutil detach "$mount" -force >/dev/null || true' EXIT
            app=$(ls -d "$mount"/*.app)
            executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")
            if [[ "${OZONE_DESKTOP_SIGNED:-}" == "true" ]]; then
              # What Gatekeeper decides on someone else's Mac, checked here instead.
              codesign --verify --deep --strict --verbose=2 "$app"
              spctl --assess --type execute --verbose=2 "$app"
              xcrun stapler validate "$app"
            fi
            "${check[@]}" --executable "$app/Contents/MacOS/$executable"
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            # Installs silently into a scratch folder, so this also checks the installer people run.
            installer=$(cygpath -w "$(ls release/*.exe | head -n 1)")
            target=$(cygpath -w "$RUNNER_TEMP/launch-install")
            powershell -NoProfile -Command "Start-Process -Wait -FilePath '$installer' -ArgumentList '/S','/D=$target'"
            app=$(ls "$RUNNER_TEMP"/launch-install/*.exe | grep -iv uninstall | head -n 1)
            "${check[@]}" --executable "$app"
          else
            appimage=$(ls "$GITHUB_WORKSPACE"/release/*.AppImage)
            chmod +x "$appimage"
            (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null)
            xvfb-run -a "${check[@]}" --executable "$RUNNER_TEMP/squashfs-root/ozone"
          fi

      - name: Upload what the launch check saw
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: launch-check-${{ matrix.key }}
          path: ${{ runner.temp }}/launch-check
          if-no-files-found: ignore

      # The .yml and .blockmap files are the update feed: an installed app reads them from the
      # release to find a newer version.
      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-publish
          for file in release/*.dmg release/*.zip release/*.AppImage release/*.deb release/*.exe release/*.blockmap release/*.yml release-cli/*; do
            [[ "$file" == */builder-debug.yml ]] && continue
            cp "$file" release-publish/
          done
          ls -la release-publish

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ozone-${{ matrix.key }}
          path: release-publish/*
          if-no-files-found: error
          compression-level: 0
          # Over a gigabyte per run: a release keeps its own copies, so these need not stay.
          retention-days: 3

  draft:
    name: Draft the release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          pattern: ozone-*
          merge-multiple: true
          path: assets

      # The app checks a command-line archive against this file before it installs one.
      - name: Write checksums
        working-directory: assets
        run: |
          sha256sum ozone-*.tar.gz ozone-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "Ozone ${GITHUB_REF_NAME#v}"
          fi
          gh release upload "$GITHUB_REF_NAME" assets/* --clobber
