name: Ozone CI

# The checks every change gets. ozone-release.yml builds what people install.
on:
  pull_request:
  push:
    branches:
      - main
      - "claude/**"

permissions:
  contents: read

concurrency:
  group: ozone-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Format
        run: vp fmt --check

      - name: Lint
        run: vp lint --report-unused-disable-directives

      - name: Typecheck
        run: vp run -r --cache --concurrency-limit 4 typecheck

      - name: Unused code
        run: vp run knip:check

  # Which test jobs the change can affect. A pull request runs those. A push runs all of them, as
  # the backstop for anything this misses. The web suite below always runs.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      test: ${{ steps.detect.outputs.test }}
      test_packages: ${{ steps.detect.outputs.test_packages }}
      test_server: ${{ steps.detect.outputs.test_server }}
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      # Only the manifests the script reads to build the dependency graph. Depth 2 brings the
      # commit a pull request is compared against.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          sparse-checkout: |
            /pnpm-workspace.yaml
            /.github/scripts/ci-changes.cjs
            /.github/actions/ci-changes/
            /*/package.json
            /*/*/package.json
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Detect affected jobs
        id: detect
        uses: ./.github/actions/ci-changes

  # The packages, the desktop app, the scripts and the evals' graders. They take about two minutes.
  test:
    name: Package tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.test != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # The desktop tests compile the browser secret helper, which links libsecret.
      - name: Install the secret helper's build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      # electron's install.js, which ensure:electron runs, reads this cache before it downloads.
      - name: Cache Electron download
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      # `changes` lists the affected packages, or nothing when all of them are.
      - name: Test
        env:
          TEST_PACKAGES: ${{ needs.changes.outputs.test_packages }}
        run: |
          filters=(--filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web')
          if [[ -n "$TEST_PACKAGES" ]]; then
            filters=()
            for package in $TEST_PACKAGES; do filters+=(--filter "$package"); done
          fi
          vp run --parallel --concurrency-limit 4 "${filters[@]}" test

  # The server's suite takes a quarter of an hour on one machine, so it is split across runners.
  # Its sequencer, apps/server/src/testUtils/weightedShardSequencer.ts, evens the shards out.
  test_server:
    name: Server tests (${{ matrix.shard }}/6)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.test_server != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      # The server's browser tests drive a real headless Chromium.
      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/server/node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/server/node_modules/playwright-core/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/server/node_modules/playwright-core/cli.js install-deps chromium
          fi

      - name: Test
        working-directory: apps/server
        run: vp test run --shard=${{ matrix.shard }}/6

  rust:
    name: Rust tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /native/
          sparse-checkout-cone-mode: false

      - name: Test the native crates
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo test --locked --manifest-path "native/$crate/Cargo.toml"
          done

  # The whole web suite runs in headless Chromium, split across jobs to fit a standard runner.
  web:
    name: Web tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      # Vite bundles a dependency the first time a test asks for it. On a fresh runner the browser
      # sometimes loses its connection in the middle of a run, most likely when a late bundle makes
      # the page reload. The cache keeps what earlier runs bundled. It is saved after every run,
      # failed ones too: a run that lost its browser has bundled what the next one needs.
      - name: Restore Vite's dependency bundles
        uses: actions/cache/restore@v6
        with:
          path: apps/web/node_modules/.vite
          key: web-vite-deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/vite.config.ts') }}-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            web-vite-deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/vite.config.ts') }}-${{ matrix.shard }}-

      # The package's own test script, plus the shard. A shard that fails runs once more, on what
      # its first try bundled: a lost browser passes then, and a test that is broken fails again.
      - name: Test
        working-directory: apps/web
        run: |
          run_shard() {
            vp test run --passWithNoTests --project unit --project browser --shard=${{ matrix.shard }}/4
          }
          run_shard || {
            echo "::warning::Web shard ${{ matrix.shard }} failed once. Running it again."
            run_shard
          }

      - name: Save Vite's dependency bundles
        if: always()
        uses: actions/cache/save@v6
        with:
          path: apps/web/node_modules/.vite
          key: web-vite-deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/vite.config.ts') }}-${{ matrix.shard }}-${{ github.run_id }}
