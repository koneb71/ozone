name: Ozone upstream check

# Tries to merge T3 Code's main into the default branch every week and checks the result. It pushes
# nothing: a red run says the fork has drifted, and its summary says where. Merge by hand, as
# docs/ozone/README.md describes.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ozone-upstream
  cancel-in-progress: true

env:
  UPSTREAM: https://github.com/pingdotgg/t3code.git

jobs:
  merge:
    name: Merge upstream's main
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # The whole history: a merge needs the commit both sides share.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Merge
        id: merge
        run: |
          git config user.name "Ozone upstream check"
          git config user.email "ozone-upstream-check@users.noreply.github.com"
          git fetch --no-tags "$UPSTREAM" main
          behind=$(git rev-list --count HEAD..FETCH_HEAD)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "Upstream is $behind commits ahead." >> "$GITHUB_STEP_SUMMARY"
          if [ "$behind" = "0" ]; then exit 0; fi
          if ! git merge --no-ff --no-edit FETCH_HEAD; then
            {
              echo "### These files conflict"
              echo
              git diff --name-only --diff-filter=U | sed 's/^/- /'
              echo
              echo "Keep upstream's side and re-apply the seam: docs/ozone/SEAMS.md says why each exists."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # A merge can add upstream workflows. They are parked, as a person merging would.
          for file in .github/workflows/*; do
            case "$(basename "$file")" in
              ozone-*) ;;
              *) git mv "$file" ".github/workflows-upstream/$(basename "$file")" ;;
            esac
          done

      - name: Setup dependencies
        if: steps.merge.outputs.behind != '0'
        uses: ./.github/actions/setup-ci-deps

      - name: Format
        if: steps.merge.outputs.behind != '0'
        run: vp fmt --check

      - name: Lint
        if: steps.merge.outputs.behind != '0'
        run: vp lint --report-unused-disable-directives

      - name: Typecheck
        if: steps.merge.outputs.behind != '0'
        run: vp run -r --cache --concurrency-limit 4 typecheck

      - name: Ozone tests
        if: steps.merge.outputs.behind != '0'
        run: vp test run apps/server/src/ozone apps/web/src/ozone
