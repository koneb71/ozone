<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="864" viewBox="0 0 640 432">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F6F8FF"/>
      <stop offset="1" stop-color="#E6EBFB"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="haze">
      <stop stop-color="#7C8CFF" stop-opacity=".3"/>
      <stop offset="1" stop-color="#7C8CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mist">
      <stop stop-color="#5CCBF5" stop-opacity=".26"/>
      <stop offset="1" stop-color="#5CCBF5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="432" fill="url(#sky)"/>
  <circle cx="60" cy="10" r="230" fill="url(#haze)"/>
  <circle cx="610" cy="430" r="250" fill="url(#mist)"/>
  <!-- Orbits around a centre below the window, after the mark: rings, and one atom on its orbit. -->
  <g fill="none" stroke="url(#ring)">
    <circle cx="320" cy="640" r="250" stroke-width="26" opacity=".1"/>
    <circle cx="320" cy="640" r="330" stroke-width="1.2" opacity=".4"/>
    <circle cx="320" cy="640" r="410" stroke-width="1" opacity=".28"/>
    <circle cx="320" cy="640" r="490" stroke-width="1" opacity=".18"/>
  </g>
  <circle cx="571" cy="426" r="6" fill="#6366F1" opacity=".75"/>
  <circle cx="34" cy="346" r="3.5" fill="#38BDF8" opacity=".8"/>
  <!-- The mark from apps/web/src/ozone/OzoneMark.tsx. -->
  <svg x="30" y="20" width="22" height="22" viewBox="0 0 64 64">
    <circle cx="30" cy="34" r="19" fill="none" stroke="url(#ring)" stroke-width="9"/>
    <circle cx="51" cy="13" r="7" fill="#6366F1"/>
  </svg>
  <text x="58" y="38" fill="#1B1F3B" font-family="Helvetica" font-size="15" font-weight="700">Ozone</text>
  <text x="320" y="104" fill="#1B1F3B" font-family="Helvetica" font-size="23" font-weight="700" text-anchor="middle">Drag Ozone into Applications.</text>
  <path d="M270 204Q320 179 370 204M358 190L370 204L351 209" stroke="url(#ring)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="367" fill="#5A6080" font-family="Helvetica" font-size="12" font-weight="400" text-anchor="middle">Once copied, open it from Applications.</text>
</svg>
